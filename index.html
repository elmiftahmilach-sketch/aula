<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Peminjaman Aula RKB v3.4.3 Full</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <img id="logoSekolah" src="SMA DTBS.png" alt="Logo" />
      <div>
        <h1>Peminjaman Aula RKB</h1>
        <p>SMADTBS</p>
      </div>
    </div>
    <div class="header-actions">
      <button id="openSettings" class="secondary">Pengaturan</button>
    </div>
  </header>

  <main>
    <section class="form-section">
      <h2>Form Peminjaman</h2>
      <form id="bookingForm">
        <div class="grid">
          <label><span>Tanggal Pengajuan</span><input type="date" id="tanggalPengajuan" required></label>
          <label><span>Nama Peminjam</span><input type="text" id="namaPeminjam" required placeholder="Nama"></label>
          <label><span>Unit/Lembaga</span><input type="text" id="unitLembaga" required placeholder="Yayasan / DKM"></label>
          <label><span>Kegiatan/Acara</span><input type="text" id="kegiatan" required placeholder="Acara"></label>
          <label><span>Jumlah Peserta</span><input type="number" id="jumlahPeserta" required min="1" step="1" placeholder="100"></label>
          <label><span>Tanggal Penggunaan</span><input type="date" id="tanggalPenggunaan" required></label>
          <label><span>Waktu Mulai</span><input type="time" id="waktuMulai" required></label>
          <label><span>Waktu Selesai</span><input type="time" id="waktuSelesai" required></label>

          <!-- Fasilitas: checkbox + Lainnya (Opsi A) -->
          <label class="full"><span>Fasilitas</span></label>
          <div id="fasilitasGroup" class="checkbox-group">
            <label><input type="checkbox" value="Sound System"> Sound System</label>
            <label><input type="checkbox" value="Proyektor"> Proyektor</label>
            <label><input type="checkbox" value="Meja Pendaftaran"> Meja Pendaftaran</label>
            <label><input type="checkbox" value="Kursi Tambahan"> Kursi Tambahan</label>
            <label><input type="checkbox" value="Mikrofon Nirkabel"> Mikrofon Nirkabel</label>
            <label><input type="checkbox" value="AC / Kipas"> AC / Kipas</label>
            <label><input type="checkbox" value="Karpet"> Karpet</label>
            <div class="lainnya-row">
              <label><input type="checkbox" id="fasilitasLainnyaCbx" value="__LAINNYA__"> Lainnya</label>
              <input type="text" id="fasilitasLainnyaTxt" class="lainnya-input" placeholder="Tulis fasilitas lain..." />
            </div>
          </div>

          <label class="full"><span>Kontak</span><input type="text" id="kontak" required placeholder="HP/Email"></label>
          <label class="full"><span>Catatan</span><textarea id="catatan" rows="2"></textarea></label>

          <div class="full attach">
            <label class="file-label">
              <span>Upload Surat Peminjaman (PDF/JPG/PNG) — disimpan di IndexedDB</span>
              <input type="file" id="suratFile" accept="application/pdf,image/*" />
            </label>
            <div id="suratInfo" class="surat-info">Belum ada file.</div>
            <div class="actions small">
              <button type="button" id="clearSurat" class="secondary">Hapus Surat</button>
            </div>
          </div>
        </div>
        <div class="actions">
          <button type="submit" id="submitBtn">Simpan</button>
          <button type="button" id="resetFilterBtn" class="secondary">Reset Filter</button>
        </div>
        <input type="hidden" id="editId" />
      </form>
      <div id="msg" class="msg hidden"></div>
    </section>

    <section class="list-section">
      <div class="list-header">
        <h2>Daftar Peminjaman</h2>
        <div class="filters">
          <input type="text" id="searchBox" placeholder="Cari...">
          <input type="date" id="filterTanggal" placeholder="">
          <button id="exportCsvBtn" class="secondary">Ekspor CSV</button>
          <button id="exportExcelBtn" class="secondary">Ekspor Excel (.xls)</button>
        </div>
      </div>
      <div class="table-wrap">
        <table id="bookingTable">
          <thead><tr>
            <th>#</th><th>No. Surat</th><th>Tgl Pengajuan</th><th>Nama</th><th>Unit</th>
            <th>Kegiatan</th><th>Peserta</th><th>Tgl Pakai</th><th>Mulai</th><th>Selesai</th>
            <th>Fasilitas</th><th>Kontak</th><th>Surat</th><th>Status</th><th>Aksi</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Modal TTD Peminjam -->
  <div id="ttdModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="ttdTitle">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="ttdTitle">Tanda Tangan Peminjam</h3>
        <button id="closeTtd" class="secondary">Tutup</button>
      </div>
      <div class="modal-body">
        <canvas id="ttdCanvas" width="600" height="200"></canvas>
        <div class="actions">
          <button id="clearTtd" class="secondary">Bersihkan</button>
          <button id="saveTtd">Simpan TTD</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Pengaturan Logo -->
  <div id="settingsPanel" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="settingsTitle">Pengaturan</h3>
        <button id="closeSettings" class="secondary">Tutup</button>
      </div>
      <div class="modal-body">
        <label class="full">
          <span>Logo Sekolah</span>
          <input type="file" id="logoInput" accept="image/*" />
          <small>Unggah gambar (PNG/JPG). Logo tersimpan lokal di perangkat Anda.</small>
        </label>
        <div class="logo-preview">
          <img id="logoPreview" src="logo.png" alt="Pratinjau Logo" />
        </div>
        <div class="actions">
          <button id="saveLogoBtn">Simpan Logo</button>
          <button id="resetLogoBtn" class="secondary">Gunakan logo.png</button>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <small>v3.4.3 — LocalStorage key: <code id="kdisp"></code></small>
  </footer>

  <div id="toast" class="toast hidden">Tersimpan.</div>

  <script src="app.js"></script>
</body>
</html>
